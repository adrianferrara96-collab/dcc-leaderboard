name: Sync Strava Segment Times
on:
  schedule:
    - cron: '0 6 * * *'  # runs once daily at midnight Monterrey time (UTC-6)
  workflow_dispatch:      # allows manual trigger from GitHub UI
jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Run Strava sync
        env:
          STRAVA_CLIENT_ID: ${{ secrets.STRAVA_CLIENT_ID }}
          STRAVA_CLIENT_SECRET: ${{ secrets.STRAVA_CLIENT_SECRET }}
          STRAVA_REFRESH_TOKEN_FERRARA: ${{ secrets.STRAVA_REFRESH_TOKEN_FERRARA }}
          STRAVA_REFRESH_TOKEN_MILLER: ${{ secrets.STRAVA_REFRESH_TOKEN_MILLER }}
          STRAVA_REFRESH_TOKEN_COLOR: ${{ secrets.STRAVA_REFRESH_TOKEN_COLOR }}
          STRAVA_REFRESH_TOKEN_APO: ${{ secrets.STRAVA_REFRESH_TOKEN_APO }}
          STRAVA_REFRESH_TOKEN_VEGA: ${{ secrets.STRAVA_REFRESH_TOKEN_VEGA }}
          STRAVA_REFRESH_TOKEN_DIEGO: ${{ secrets.STRAVA_REFRESH_TOKEN_DIEGO }}
          STRAVA_REFRESH_TOKEN_AGUIRRE: ${{ secrets.STRAVA_REFRESH_TOKEN_AGUIRRE }}
          STRAVA_REFRESH_TOKEN_GUZMAN: ${{ secrets.STRAVA_REFRESH_TOKEN_GUZMAN }}
          JSONBIN_MASTER_KEY: ${{ secrets.JSONBIN_MASTER_KEY }}
        run: node sync_strava.js
